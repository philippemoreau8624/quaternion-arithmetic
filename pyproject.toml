[project]
name = "quaternion-arithmetic"
version = "0.1.0"
description = "Hamilton product, conjugate, norm, and rotation extraction for four-component real quaternions represented as tuples."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
